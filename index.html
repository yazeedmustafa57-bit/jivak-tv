    <script>
      // Alte Hash-Links (/#/...) sauber auf echte URLs umleiten
      (function () {
        if (location.hash && location.hash.indexOf('#/') === 0) {
          location.replace(location.pathname.replace(/\/+$/, '') + location.hash.slice(1) + location.search)
        }
      })()
    </script>
    <script>
      // Theme vor dem ersten Render anwenden (kein Flackern)
      (function () {
        try {
          var t = localStorage.getItem('jivak-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
